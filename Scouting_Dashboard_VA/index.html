<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scout Analytics Pro - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pca-js@1.0.0/pca.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <button id="btn-open-filters" class="filter-toggle-btn">⚙️ FILTRI</button>

    <div id="sidebar-overlay"></div>

    <div id="floating-menu">
        <div class="fab-actions">
            <button id="btn-scroll" class="fab-btn active" title="Modalità Scroll (Disattiva Strumenti)">👆</button>
            <button id="btn-zoom" class="fab-btn" title="Naviga Mappe (Zoom)">🔍</button>
            <button id="btn-lasso" class="fab-btn" title="Selezione Lazo">✍️</button>
            <button id="btn-reset" class="fab-btn btn-danger" title="Reset Generale">✖</button>
        </div>
        <button id="btn-fab-toggle" class="fab-btn main-fab" title="Strumenti Dashboard">🛠️</button>
    </div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">⚽ Scout Pro</h2>
            <button id="btn-close-filters" class="close-btn">✖</button>
        </div>
        
        <div class="filter-group">
            <label>Età Massima: <span id="age-val" class="highlight">25</span> anni</label>
            <input type="range" id="filter-age" class="filter-input" min="16" max="25" value="25">
        </div>

        <div class="filter-group">
            <label>Ruolo in Campo</label>
            <select id="filter-role" class="filter-input">
                <option value="All">Tutti i Ruoli</option>
                <optgroup label="Macro Aree">
                    <option value="MACRO_ATT">Attaccanti (Tutti)</option>
                    <option value="MACRO_MID">Centrocampisti (Tutti)</option>
                    <option value="MACRO_DEF">Difensori (Tutti)</option>
                </optgroup>
                <optgroup label="Ruoli Specifici">
                    <option value="ST">ST - Punta</option>
                    <option value="RW">RW - Ala Destra</option>
                    <option value="LW">LW - Ala Sinistra</option>
                    <option value="CAM">CAM - Trequartista</option>
                    <option value="CM">CM - Centrale</option>
                    <option value="CDM">CDM - Mediano</option>
                    <option value="CB">CB - Difensore Centrale</option>
                    <option value="RB">RB - Terzino Destro</option>
                    <option value="LB">LB - Terzino Sinistro</option>
                </optgroup>
            </select>
        </div>

        <div class="filter-group">
            <label>Campionato</label>
            <select id="filter-league" class="filter-input">
                <option value="All">Tutti i Campionati</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Nazionalità (English)</label>
            <select id="filter-nationality" class="filter-input">
                <option value="All">Tutte le Nazionalità</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Valore Mercato (€)</label>
            <div class="min-max-inputs">
                <input type="number" id="filter-val-min" class="filter-input" placeholder="Min">
                <input type="number" id="filter-val-max" class="filter-input" placeholder="Max">
            </div>
        </div>

        <div class="filter-group">
            <label>Stipendio (€)</label>
            <div class="min-max-inputs">
                <input type="number" id="filter-wage-min" class="filter-input" placeholder="Min">
                <input type="number" id="filter-wage-max" class="filter-input" placeholder="Max">
            </div>
        </div>
        
        <button id="btn-apply-filters" class="btn-apply">Applica Filtri</button>
    </aside>

    <main id="dashboard">
        <div class="dashboard-header">
            <div id="league-legend" class="legend-horizontal"></div>
        </div>

        <div class="dashboard-grid">
            <div class="view-container full-width" id="pca-view">
                <h3 class="view-title">Mappa dei Talenti (PCA)</h3>
                <div class="svg-wrapper" id="svg-pca"></div>
            </div>

            <div class="view-container full-width" id="eco-view">
                <h3 class="view-title">Analisi Economica (Scala Logaritmica)</h3>
                <div class="svg-wrapper" id="svg-eco"></div>
            </div>

            <div class="view-container half-width" id="radar-view">
                <h3 class="view-title">Profilo Tecnico Medio</h3>
                <div class="svg-wrapper" id="svg-radar"></div>
            </div>
            <div class="view-container half-width" id="bar-view">
                <h3 class="view-title">Trend di Crescita (Età vs Potenziale)</h3>
                <div class="svg-wrapper" id="svg-bar"></div>
            </div>

            <div class="view-container full-width" id="table-view">
                <h3 class="view-title">Database Giocatori Selezionati</h3>
                <div id="table-wrapper">
                    <div class="empty-state">Usa lo strumento Lazo per visualizzare i giocatori.</div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
